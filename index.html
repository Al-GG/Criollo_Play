<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Volantines</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #87c5ea; font-family: system-ui, sans-serif; }
  canvas { display: block; }
  #hud {
    position: fixed; top: 12px; left: 12px; color: #fff;
    background: rgba(0,0,0,0.35); padding: 10px 14px; border-radius: 10px;
    font-size: 14px; line-height: 1.6; pointer-events: none; min-width: 170px;
  }
  #hud b { font-size: 18px; }
  #help {
    position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
    color: #fff; background: rgba(0,0,0,0.35); padding: 8px 14px; border-radius: 10px;
    font-size: 13px; pointer-events: none; text-align: center; white-space: nowrap;
  }
  #msg {
    position: fixed; top: 40%; left: 50%; transform: translate(-50%, -50%);
    color: #fff; font-size: 34px; font-weight: 700; text-shadow: 0 2px 8px rgba(0,0,0,0.5);
    pointer-events: none; text-align: center;
  }
  #windAlert {
    position: fixed; top: 18%; left: 50%; transform: translate(-50%, -10px);
    color: #fff; font-size: 26px; font-weight: 700; text-shadow: 0 2px 8px rgba(0,0,0,0.5);
    pointer-events: none; opacity: 0; transition: opacity 0.4s, transform 0.4s;
  }
  #windAlert.show { opacity: 1; transform: translate(-50%, 0); }
  #msg small { display: block; font-size: 16px; font-weight: 400; margin-top: 6px; }
</style>
</head>
<body>
<div id="hud">
  Altura: <b id="alt">0</b> m<br>
  Máxima: <span id="max">0</span> m<br>
  Hilo: <span id="len">0</span> m<br>
  Viento: <span id="wind">0</span> km/h <span id="windArrow"></span><br>
  <span id="windType">Brisa</span> · cambia en <span id="windNext">10</span> s
</div>
<div id="windAlert"></div>
<div id="help">
  <b>ESPACIO / click</b> tirar &nbsp;·&nbsp; <b>A D / ← →</b> dirigir &nbsp;·&nbsp; <b>S / ↓</b> dar hilo &nbsp;·&nbsp; <b>R</b> reiniciar
</div>
<div id="msg">¡Tira para elevar el volantín!<small>Mantén ESPACIO o el click</small></div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
import * as THREE from 'three';

// ---------- Escena ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87c5ea);
scene.fog = new THREE.Fog(0x87c5ea, 80, 320);

const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 1000);

scene.add(new THREE.HemisphereLight(0xdff2ff, 0x5a8a3a, 0.9));
const sun = new THREE.DirectionalLight(0xffffff, 1.4);
sun.position.set(30, 60, 20);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -40, right: 40, top: 40, bottom: -40 });
scene.add(sun);

// Suelo
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(800, 800),
  new THREE.MeshLambertMaterial({ color: 0x6fb04a })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// Cerros al fondo
const hillMat = new THREE.MeshLambertMaterial({ color: 0x4f8f3a });
for (let i = 0; i < 14; i++) {
  const r = 25 + Math.random() * 35;
  const hill = new THREE.Mesh(new THREE.SphereGeometry(r, 16, 12), hillMat);
  hill.position.set(-200 + i * 30 + Math.random() * 20, -r * 0.55, -180 - Math.random() * 60);
  scene.add(hill);
}

// Árboles
const trunkMat = new THREE.MeshLambertMaterial({ color: 0x7a5230 });
const leafMat = new THREE.MeshLambertMaterial({ color: 0x2f7a32 });
for (let i = 0; i < 40; i++) {
  const x = (Math.random() - 0.5) * 160;
  const z = -20 - Math.random() * 120;
  if (Math.abs(x) < 6 && z > -30) continue;
  const tree = new THREE.Group();
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.35, 2), trunkMat);
  trunk.position.y = 1;
  const leaves = new THREE.Mesh(new THREE.ConeGeometry(1.6, 4, 8), leafMat);
  leaves.position.y = 4;
  trunk.castShadow = leaves.castShadow = true;
  tree.add(trunk, leaves);
  const s = 0.7 + Math.random() * 0.8;
  tree.scale.setScalar(s);
  tree.position.set(x, 0, z);
  scene.add(tree);
}

// Nubes
const cloudMat = new THREE.MeshLambertMaterial({ color: 0xffffff });
const clouds = [];
for (let i = 0; i < 18; i++) {
  const c = new THREE.Group();
  const n = 3 + Math.floor(Math.random() * 3);
  for (let j = 0; j < n; j++) {
    const puff = new THREE.Mesh(new THREE.SphereGeometry(3 + Math.random() * 3, 10, 8), cloudMat);
    puff.position.set(j * 4 - n * 2, Math.random() * 2, Math.random() * 3);
    c.add(puff);
  }
  c.position.set((Math.random() - 0.5) * 300, 45 + Math.random() * 50, -40 - Math.random() * 200);
  scene.add(c);
  clouds.push(c);
}

// Jugador (figura simple)
const player = new THREE.Group();
const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.3, 0.8, 4, 8), new THREE.MeshLambertMaterial({ color: 0xd9412b }));
body.position.y = 0.9;
const head = new THREE.Mesh(new THREE.SphereGeometry(0.22, 12, 10), new THREE.MeshLambertMaterial({ color: 0xf1c79b }));
head.position.y = 1.65;
body.castShadow = head.castShadow = true;
player.add(body, head);
scene.add(player);

// ---------- Volantín ----------
function makeKite() {
  const g = new THREE.Group();
  const top = [0, 0.9, 0], right = [0.65, 0.1, 0], bottom = [0, -0.75, 0], left = [-0.65, 0.1, 0], c = [0, 0.1, 0];
  const colors = [0xffd500, 0xe0262b, 0x1e5bd8, 0xffffff];
  const tris = [[top, right, c], [right, bottom, c], [bottom, left, c], [left, top, c]];
  tris.forEach((t, i) => {
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(t.flat(), 3));
    geo.computeVertexNormals();
    const m = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ color: colors[i], side: THREE.DoubleSide }));
    m.castShadow = true;
    g.add(m);
  });
  // Varillas
  const stickMat = new THREE.MeshBasicMaterial({ color: 0x5b3b1e });
  const v = new THREE.Mesh(new THREE.BoxGeometry(0.03, 1.65, 0.03), stickMat);
  v.position.set(0, 0.075, -0.02);
  const h = new THREE.Mesh(new THREE.BoxGeometry(1.3, 0.03, 0.03), stickMat);
  h.position.set(0, 0.1, -0.02);
  g.add(v, h);
  return g;
}
const kite = makeKite();
scene.add(kite);

// Hilo
const STRING_PTS = 24;
const stringGeo = new THREE.BufferGeometry();
stringGeo.setAttribute('position', new THREE.Float32BufferAttribute(new Float32Array(STRING_PTS * 3), 3));
const stringLine = new THREE.Line(stringGeo, new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.85 }));
stringLine.frustumCulled = false;
scene.add(stringLine);

// Cola (cadena verlet)
const TAIL_N = 14, TAIL_SEG = 0.35;
const tail = [];
for (let i = 0; i < TAIL_N; i++) tail.push({ p: new THREE.Vector3(), o: new THREE.Vector3() });
const tailGeo = new THREE.BufferGeometry();
tailGeo.setAttribute('position', new THREE.Float32BufferAttribute(new Float32Array(TAIL_N * 3), 3));
const tailLine = new THREE.Line(tailGeo, new THREE.LineBasicMaterial({ color: 0xe0262b }));
tailLine.frustumCulled = false;
scene.add(tailLine);
const bows = [];
const bowGeo = new THREE.PlaneGeometry(0.28, 0.12);
for (let i = 2; i < TAIL_N; i += 2) {
  const b = new THREE.Mesh(bowGeo, new THREE.MeshBasicMaterial({ color: i % 4 ? 0xffd500 : 0x1e5bd8, side: THREE.DoubleSide }));
  scene.add(b);
  bows.push({ mesh: b, idx: i });
}

// ---------- Estado / física ----------
const anchor = new THREE.Vector3(0, 1.4, 0);
const pos = new THREE.Vector3();
const vel = new THREE.Vector3();
let L, maxAlt, crashed, crashTimer, started, steerVis;
const wind = new THREE.Vector3();
let time = 0;

const MASS = 0.3, K = 0.18, LIFT = 0.9, DRAG = 0.3, SIDE = 0.3;
const REEL_IN = 4, REEL_OUT = 3, MIN_L = 3, MAX_L = 150;
// Entradas suavizadas (suben/bajan gradualmente al mantener la tecla)
let steerIn = 0, releaseIn = 0;
const STEER_RAMP = 1.5, RELEASE_RAMP = 1.2;

function reset() {
  pos.set(0, 2.5, -9);
  vel.set(0, 0, 0);
  L = 10;
  maxAlt = 0;
  crashed = false;
  crashTimer = 0;
  steerVis = 0;
  const bottom = pos.clone().add(new THREE.Vector3(0, -0.75, 0));
  tail.forEach((t, i) => { t.p.copy(bottom).y -= i * TAIL_SEG * 0.5; t.o.copy(t.p); });
}
reset();

// ---------- Controles ----------
const keys = {};
let mouseDown = false;
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'Space') e.preventDefault();
  if (e.code === 'KeyR') { reset(); showMsg(''); }
});
addEventListener('keyup', e => keys[e.code] = false);
addEventListener('mousedown', () => mouseDown = true);
addEventListener('mouseup', () => mouseDown = false);
addEventListener('touchstart', () => mouseDown = true);
addEventListener('touchend', () => mouseDown = false);

const msgEl = document.getElementById('msg');
function showMsg(html) { msgEl.innerHTML = html; }

// ---------- Viento ----------
// Cada WIND_PERIOD segundos se elige un nuevo tipo de viento y se pasa a él suavemente.
const WIND_PERIOD = 10, WIND_BLEND = 2.5;
const WIND_TYPES = [
  { name: 'Calma',   speed: 3.6, side: 0.4, gust: 0.4, gustFreq: 0.6 },
  { name: 'Brisa',   speed: 5.5, side: 1.0, gust: 0.8, gustFreq: 0.8 },
  { name: 'Fuerte',  speed: 8.0, side: 1.2, gust: 1.2, gustFreq: 1.0 },
  { name: 'Ráfagas', speed: 5.5, side: 1.5, gust: 3.0, gustFreq: 1.6 },
  { name: 'Lateral', speed: 5.0, side: 3.5, gust: 0.8, gustFreq: 0.8 },
];
let windFrom = { speed: 5.5, side: 0, gust: 0.8, gustFreq: 0.8 };
let windTo = { ...WIND_TYPES[1], side: 0 };
let windName = 'Brisa', windChangeAt = WIND_PERIOD;
const windCur = { ...windTo };

function pickWind() {
  let type;
  do { type = WIND_TYPES[Math.floor(Math.random() * WIND_TYPES.length)]; } while (type.name === windName);
  windFrom = { ...windCur };
  windTo = { ...type, side: type.side * (Math.random() < 0.5 ? -1 : 1) };
  windName = type.name;
  showWindAlert(type.name, windTo.side);
}

function updateWind(t, y) {
  if (t >= windChangeAt) { pickWind(); windChangeAt = t + WIND_PERIOD; }
  // Transición suave entre el viento anterior y el nuevo
  const s = THREE.MathUtils.smoothstep(t - (windChangeAt - WIND_PERIOD), 0, WIND_BLEND);
  for (const k of ['speed', 'side', 'gust', 'gustFreq']) windCur[k] = windFrom[k] + (windTo[k] - windFrom[k]) * s;

  const f = windCur.gustFreq;
  const gust = windCur.gust * (0.6 * Math.sin(t * 1.3 * f) + 0.3 * Math.sin(t * 2.9 * f + 1.3) + 0.25 * Math.sin(t * 5.1 * f + 4));
  const altFactor = 1 + Math.max(0, y) / 45;
  const forward = Math.max(0.5, windCur.speed + gust) * altFactor;
  const side = windCur.side + 0.4 * Math.sin(t * 0.37) + gust * 0.3;
  wind.set(side, 0.3 * Math.sin(t * 0.5), -forward);
}

const windAlertEl = document.getElementById('windAlert');
let windAlertTimer;
function showWindAlert(name, side) {
  const arrow = Math.abs(side) > 1 ? (side > 0 ? ' →' : ' ←') : '';
  windAlertEl.textContent = `Viento: ${name}${arrow}`;
  windAlertEl.classList.add('show');
  clearTimeout(windAlertTimer);
  windAlertTimer = setTimeout(() => windAlertEl.classList.remove('show'), 2200);
}

// ---------- Paso de física ----------
const tmp = new THREE.Vector3(), rel = new THREE.Vector3(), right = new THREE.Vector3();
function physics(dt) {
  const pulling = keys.Space || mouseDown;
  const releasing = keys.KeyS || keys.ArrowDown;
  const steerTarget = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0);
  steerIn += THREE.MathUtils.clamp(steerTarget - steerIn, -STEER_RAMP * dt, STEER_RAMP * dt);
  releaseIn += THREE.MathUtils.clamp((releasing ? 1 : 0) - releaseIn, -RELEASE_RAMP * 2 * dt, RELEASE_RAMP * dt);
  const steer = steerIn;

  if (pulling && !started) { started = true; showMsg(''); }

  updateWind(time, pos.y);

  if (crashed) {
    vel.multiplyScalar(0.9);
    crashTimer -= dt;
    if (crashTimer <= 0) { reset(); showMsg(''); }
    return;
  }

  // Largo del hilo
  let reelSpeed = 0;
  if (pulling) { L = Math.max(MIN_L, L - REEL_IN * dt); reelSpeed = REEL_IN; }
  if (releaseIn > 0) L = Math.min(MAX_L, L + REEL_OUT * releaseIn * dt);

  // Fuerzas aerodinámicas
  rel.subVectors(wind, vel);
  const v2 = rel.lengthSq();
  const q = K * v2;
  tmp.subVectors(pos, anchor);
  const d = tmp.length();
  const elev = Math.asin(THREE.MathUtils.clamp(tmp.y / d, -1, 1));
  const liftFactor = 0.4 + 0.8 * Math.cos(elev);

  const force = new THREE.Vector3();
  force.addScaledVector(rel.clone().normalize(), DRAG * q);   // arrastre
  force.y += LIFT * q * liftFactor;                            // sustentación
  right.set(1, 0, 0);
  force.addScaledVector(right, steer * SIDE * q);              // dirección
  force.y -= MASS * 9.8;                                       // gravedad

  vel.addScaledVector(force, dt / MASS);
  vel.multiplyScalar(0.995);
  pos.addScaledVector(vel, dt);

  // Restricción del hilo
  tmp.subVectors(pos, anchor);
  const dist = tmp.length();
  if (dist > L) {
    tmp.divideScalar(dist);
    pos.copy(anchor).addScaledVector(tmp, L);
    const radial = vel.dot(tmp);
    if (radial > -reelSpeed) vel.addScaledVector(tmp, -radial - reelSpeed);
  }

  steerVis += (steer - steerVis) * Math.min(1, dt * 5);

  // Choque con el suelo
  if (pos.y < 0.4 && started) {
    pos.y = 0.4;
    crashed = true;
    crashTimer = 2.5;
    showMsg(`¡Se cayó el volantín!<small>Máxima: ${maxAlt.toFixed(1)} m</small>`);
  }
  if (pos.y < 0.4) { pos.y = 0.4; vel.y = Math.max(0, vel.y); }

  maxAlt = Math.max(maxAlt, pos.y);
}

function tailPhysics(dt, attach) {
  tail[0].p.copy(attach);
  const g = new THREE.Vector3(0, -3, 0);
  for (let i = 1; i < TAIL_N; i++) {
    const t = tail[i];
    const v = tmp.subVectors(t.p, t.o).multiplyScalar(0.96);
    t.o.copy(t.p);
    const acc = g.clone().addScaledVector(wind, 0.9);
    t.p.add(v).addScaledVector(acc, dt * dt);
  }
  for (let it = 0; it < 4; it++) {
    for (let i = 1; i < TAIL_N; i++) {
      const a = tail[i - 1].p, b = tail[i].p;
      const delta = tmp.subVectors(b, a);
      const len = delta.length() || 1e-6;
      b.copy(a).addScaledVector(delta, TAIL_SEG / len);
    }
  }
}

// ---------- Render ----------
const camTarget = new THREE.Vector3(0, 5, -10);
const camPos = new THREE.Vector3(0, 3, 7);
const up = new THREE.Vector3(0, 1, 0);

function updateVisuals(dt) {
  // Orientación del volantín: mira al jugador, con giro según dirección
  kite.position.copy(pos);
  kite.up.copy(up);
  kite.lookAt(anchor);
  kite.rotateX(-0.35);
  kite.rotateZ(-steerVis * 0.6 + Math.sin(time * 6) * 0.04);

  // Cola
  kite.updateMatrixWorld();
  const attach = new THREE.Vector3(0, -0.75, 0).applyMatrix4(kite.matrixWorld);
  tailPhysics(dt, attach);
  const tp = tailGeo.attributes.position;
  tail.forEach((t, i) => tp.setXYZ(i, t.p.x, t.p.y, t.p.z));
  tp.needsUpdate = true;
  bows.forEach(b => {
    b.mesh.position.copy(tail[b.idx].p);
    b.mesh.lookAt(camera.position);
  });

  // Hilo con comba
  const sp = stringGeo.attributes.position;
  const dist = pos.distanceTo(anchor);
  const slack = Math.max(0, L - dist);
  const sag = 0.02 * dist + slack * 0.5;
  for (let i = 0; i < STRING_PTS; i++) {
    const s = i / (STRING_PTS - 1);
    tmp.lerpVectors(anchor, pos, s);
    tmp.y -= Math.sin(Math.PI * s) * sag;
    sp.setXYZ(i, tmp.x, tmp.y, tmp.z);
  }
  sp.needsUpdate = true;

  // Jugador mira hacia el volantín
  player.rotation.y = Math.atan2(pos.x, -pos.z) * -1 + Math.PI;

  // Cámara
  const desiredPos = new THREE.Vector3(pos.x * 0.15, 2.5 + pos.y * 0.08, 8 + L * 0.08);
  camPos.lerp(desiredPos, Math.min(1, dt * 2));
  const desiredTarget = new THREE.Vector3().lerpVectors(anchor, pos, 0.7);
  camTarget.lerp(desiredTarget, Math.min(1, dt * 3));
  camera.position.copy(camPos);
  camera.lookAt(camTarget);

  // Nubes
  clouds.forEach(c => {
    c.position.z -= wind.length() * 0.02 * dt * 10;
    c.position.x += wind.x * 0.05 * dt;
    if (c.position.z < -260) c.position.z = -40;
  });

  // HUD
  document.getElementById('alt').textContent = pos.y.toFixed(1);
  document.getElementById('max').textContent = maxAlt.toFixed(1);
  document.getElementById('len').textContent = L.toFixed(0);
  document.getElementById('wind').textContent = (wind.length() * 3.6).toFixed(0);
  document.getElementById('windArrow').textContent = wind.x > 1 ? '→' : wind.x < -1 ? '←' : '↑';
  document.getElementById('windType').textContent = windName;
  document.getElementById('windNext').textContent = Math.max(0, Math.ceil(windChangeAt - time));
}

started = false;
const clock = new THREE.Clock();
function loop() {
  const frame = Math.min(clock.getDelta(), 0.05);
  const steps = 4;
  for (let i = 0; i < steps; i++) { time += frame / steps; physics(frame / steps); }
  updateVisuals(frame);
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
